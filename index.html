<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini App - Lista de Notas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="contenedor">
        <h1>Lista de Notas</h1>
        <p>Escribe una nota y presiona el botón agregar.</p>

        <!-- Input y botón -->
        <div class="formulario">
            <input type="text" id="inputNota" placeholder="Escribe una nota">
            <button id="btnAgregar">Agregar</button>
        </div>

        <!-- Lista donde se renderizan las notas -->
        <ul id="listaNotas"></ul>
    </div>

    <script src="script.js"></script>
</body>
</html>
